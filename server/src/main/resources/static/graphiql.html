<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Employee GraphQL</title>
    <link rel="stylesheet" href="https://unpkg.com/graphiql@2.4.7/graphiql.min.css">
    <link rel="stylesheet" href="https://unpkg.com/@graphiql/plugin-explorer@0.3.1/dist/style.css">
    <style>
        html, body, #graphiql { height: 100%; margin: 0; }
    </style>
</head>
<body>
<div id="graphiql">Loading GraphiQL assets...</div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/graphiql@2.4.7/graphiql.min.js"></script>
<script src="https://unpkg.com/@graphiql/plugin-explorer@0.3.1/dist/index.umd.js"></script>
<script>
    const root = document.getElementById("graphiql");
    try {
        const path = new URLSearchParams(window.location.search).get("path") || "/graphql";
        const fetcher = GraphiQL.createFetcher({
            url: `${window.location.origin}${path}`
        });
        const explorerPlugin = GraphiQLPluginExplorer.explorerPlugin();
        ReactDOM.render(
            React.createElement(GraphiQL, { fetcher, plugins: [explorerPlugin] }),
            root
        );
    } catch (error) {
        root.textContent = `Unable to load GraphiQL. Check that the GraphiQL assets are reachable. ${error}`;
    }
</script>
</body>
</html>
